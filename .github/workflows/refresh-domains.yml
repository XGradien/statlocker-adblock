name: domain-watcher

# Watches Statlocker's public ad-surface pages (and the Playwire/RAMP config
# they load) for new ad-network domains. When the app's ad stack changes,
# this opens a pull request with the new domains appended to domains.txt.
#
# The install script fetches domains.txt from this repo at install time, so
# merging these PRs updates every user on their next install run.

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch: {}

# GITHUB_TOKEN is read-only by default on public repos; the PR step needs write,
# and the watcher opens an issue when it cannot do its job.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - id: watch
        run: |
          set +e
          # Keep run artifacts out of the checkout: they used to be written to
          # the repo root, where create-pull-request would commit them.
          ART="$RUNNER_TEMP/watcher"
          mkdir -p "$ART"
          python tools/refresh_domains.py > "$ART/new-domains.txt" 2> "$ART/watch.log"
          rc=$?
          cat "$ART/watch.log" || true
          if [ $rc -eq 0 ]; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          elif [ $rc -eq 1 ]; then
            echo "status=new" >> "$GITHUB_OUTPUT"
            # Write to GITHUB_ENV in plain bash: a `python - <<EOF` here-doc
            # breaks here because YAML dedents the block, so the EOF
            # terminator is indented and bash never finds it (syntax error,
            # exit 2).
            NEW_DOMAINS="$(cat "$ART/new-domains.txt")"
            printf 'NEW_DOMAINS<<WATCHER_EOF\n%s\nWATCHER_EOF\n' "$NEW_DOMAINS" >> "$GITHUB_ENV"
          else
            echo "status=error" >> "$GITHUB_OUTPUT"
            echo "rc=$rc" >> "$GITHUB_OUTPUT"
            echo "watcher failed with exit $rc - see the log above"
          fi

      - if: steps.watch.outputs.status == 'new'
        run: |
          rc=0
          python tools/apply_new_domains.py "$RUNNER_TEMP/watcher/new-domains.txt" || rc=$?
          # apply exit codes: 0 = nothing to add, 1 = file changed (success),
          # 2 = real error. This step runs under bash -e, so the "changed"
          # exit 1 must be tolerated or every successful detection fails.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "apply_new_domains.py failed with exit code $rc"
            exit "$rc"
          fi
          # The sidecar has to change in the same commit as the list: the
          # installer refuses a live list whose checksum does not match.
          git status --short
          git diff -- domains.txt domains.txt.sha256 || true

      - if: steps.watch.outputs.status == 'new'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "watcher: append newly detected ad domains"
          title: "Watcher: new ad domain(s) detected in Statlocker's ad surface"
          body: |
            The domain watcher (runs every 12 hours) detected domains referenced
            by Statlocker's public ad-surface pages that are not in the blocklist
            and not whitelisted:

            ```
            ${{ env.NEW_DOMAINS }}
            ```

            Merging this PR updates `domains.txt`. Users pick the update up
            automatically the next time they run **Install AdBlock.bat**
            (it fetches the live list from this repo).
          branch: watcher/new-domains

      # A watcher that cannot read the ad pages is an exception, not a routine
      # PR. Open an issue so it lands in notifications, and only ever one.
      # The title is matched exactly rather than searched: GitHub's issue search
      # index lags behind creation, so a search can miss an issue made seconds
      # ago. The issues API does not.
      - if: steps.watch.outputs.status == 'error'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open="$(gh issue list --state open --limit 100 --json number,title --jq '[.[] | select(.title == "Watcher could not read Statlocker ad pages")] | length' 2>/dev/null || echo 0)"
          if [ "$open" != "0" ]; then
            echo "a watcher issue is already open - not creating another"
          else
            body=$(printf '%s\n' \
              "The domain watcher could not do its job, so the blocklist is not being maintained until someone looks." \
              "" \
              "- Exit code: ${{ steps.watch.outputs.rc }}" \
              "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              "" \
              "What the exit code means:" \
              "- **2** - a primary source (an ad page or the ad-config script) could not be fetched. Usually a runner network problem, and it often clears on the next run." \
              "- **3** - the ad pages loaded, but the ad-config script could no longer be found in them. Statlocker most likely changed how their ad pages are built, and the watcher needs updating." \
              "" \
              "The watcher closes this issue by itself once it can read the pages again.")
            gh issue create --title "Watcher could not read Statlocker ad pages" --body "$body" || echo "could not open an issue"
          fi
          echo "failing the run on purpose - the watcher saw nothing"
          exit 1

      # Once the watcher can read the pages again, close the alert so it does
      # not sit open making the repo look broken.
      - if: steps.watch.outputs.status == 'clean'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "Watcher could not read Statlocker ad pages") | .number')"
          for n in $ids; do
            gh issue comment "$n" --body "The watcher can read the ad pages again, so this looks resolved. Reopen it if the ads came back." || true
            gh issue close "$n" || true
          done
          echo "watcher issue sweep finished"
